appId: com.anonymous.tripplanner
name: Skeleton smoke - walk through all 12 screens (AC-5, AC-28)
tags:
  - smoke
# Run through the runner, which supplies LOCALE and every UI string of that locale as env vars:
#   ./scripts/e2e.sh skeleton-smoke [--locale ru|en] [--metro-url http://localhost:8081]
#
# Selection rules (AC-19): text / accessibility label only. No `id:` / testID anywhere.
# Maestro `text:` is a full-string REGEX, so:
#   - trip cards carry one long label ("place, status, dates") and are matched as "<place>,.*"
#     (the comma tells a card from the details header, whose text is the bare place);
#   - strings with regex metacharacters are pre-escaped by the runner (e.g. "Forgot password\?").
# Uniqueness: a label that appears twice on one screen (tab label == screen title on S4/S5/S6) is
# only ever TAPPED from a screen where it is the tab alone (see the tab steps), and asserted with
# `selected: true`, which only the active tab button carries.
#
# Trips: a fresh account has NO trips (the mocks are gone), so the S7 part of the walk first CREATES
# one through S8 (free-text place, "no dates yet", real local Supabase like the sign-up above) and
# reaches S7 that way, then re-opens it from the Trips card. The History card -> S7 step of the
# earlier skeleton is gone: History can only hold completed/archived trips, which needs the archive
# journey that trip-crud.yaml covers (it opens the archived card from History). The full CRUD path
# is trip-crud.yaml; this flow only proves that every screen is reachable.
---
- launchApp:
    clearState: true
    arguments:
      "-AppleLanguages": "(${LOCALE})"

# Dev-client builds land on the launcher; the runner passes DEV_CLIENT_LINK=none for standalone
# (preview/release) builds, and an exp+<slug>://expo-development-client link otherwise.
- runFlow:
    when:
      true: ${DEV_CLIENT_LINK != 'none'}
    commands:
      - openLink: ${DEV_CLIENT_LINK}
      - tapOn:
          text: "Open|Открыть"
          optional: true
      - tapOn:
          text: "Continue|Продолжить"
          optional: true

# --- S1 onboarding (AC-1, AC-18: the first screen shows up stably after launch) -------------
- extendedWaitUntil:
    visible: "${ONBOARDING_TITLE}"
    timeout: 60000
- assertVisible: "${ONBOARDING_START}"
- tapOn: "${ONBOARDING_START}"

# --- S3 sign up + S11 / S12 legal + S2 sign in + S10 forgot password (AC-6) -----------------
- assertVisible: "${SIGNUP_TITLE}"

# S11 terms. The link text is identical to the S11 title in en, so assert the S11-only body text.
- tapOn: "${SIGNUP_TERMS_LINK}"
- assertVisible: "${LEGAL_BODY}"
- tapOn: "${BACK}"
- assertVisible: "${SIGNUP_TITLE}"

# S12 privacy.
- tapOn: "${SIGNUP_PRIVACY_LINK}"
- assertVisible: "${LEGAL_BODY}"
- tapOn: "${BACK}"
- assertVisible: "${SIGNUP_TITLE}"

# S2 sign in (footer link of S3), then S10 forgot password and back.
- tapOn: "${SIGNUP_SIGNIN_LINK}"
- assertVisible: "${SIGNIN_TITLE}"
- tapOn: "${SIGNIN_FORGOT}"
- assertVisible: "${FORGOT_TITLE}"
- tapOn: "${BACK}"
- assertVisible: "${SIGNIN_TITLE}"

# Back to S3 through the "create account" link, then sign up with a fresh account (real server:
# needs the local Supabase stack up; the runner mints E2E_EMAIL per run). Fields are targeted by
# placeholder: a field's caption and its input share one label, and an errored field's label
# becomes "Label, error text".
- tapOn: "${SIGNIN_CREATE_LINK}"
- assertVisible: "${SIGNUP_TITLE}"
- tapOn: "${FIELD_NAME_PLACEHOLDER}"
- inputText: "${E2E_NAME}"
- tapOn: "${FIELD_EMAIL_PLACEHOLDER}"
- inputText: "${E2E_EMAIL}"
- tapOn: "${FIELD_PASSWORD_PLACEHOLDER}"
- inputText: "${E2E_PASSWORD}"
# The keyboard (and iOS's strong-password bar) can cover the submit button.
- hideKeyboard
- tapOn: "${SIGNUP_SUBMIT}"
# iOS may offer to save the new password; decline it so it cannot steal focus later.
- tapOn:
    text: "${SYSTEM_NOT_NOW}"
    optional: true
# The account is created on the server: allow for the round trip before the tab checks.
- extendedWaitUntil:
    visible: "${TAB_TRIPS}"
    timeout: 30000

# --- Tabs (AC-8): Trips -> History -> Profile -> Trips ---------------------------------------
- assertVisible:
    text: "${TAB_TRIPS}"
    selected: true
- tapOn: "${TAB_HISTORY}"
- assertVisible:
    text: "${TAB_HISTORY}"
    selected: true
- tapOn: "${TAB_PROFILE}"
- assertVisible:
    text: "${TAB_PROFILE}"
    selected: true
- tapOn: "${TAB_TRIPS}"
- assertVisible:
    text: "${TAB_TRIPS}"
    selected: true

# --- "+" -> new-trip modal (S8) -> cancel (AC-12: the modal closes onto Trips) -----------------
- tapOn: "${NEW_TRIP_A11Y}"
# The title "New trip" equals the "+" label, so assert the S8-only submit button instead.
- extendedWaitUntil:
    visible: "${FORM_CREATE}"
    timeout: 10000
- tapOn: "${CANCEL}"
- assertVisible:
    text: "${TAB_TRIPS}"
    selected: true

# --- "+" again -> create a trip (free-text place, no dates) -> lands on S7 ---------------------
- tapOn: "${NEW_TRIP_A11Y}"
- extendedWaitUntil:
    visible: "${FORM_DESTINATION_PLACEHOLDER}"
    timeout: 10000
- tapOn: "${FORM_DESTINATION_PLACEHOLDER}"
- inputText: "${E2E_PLACE}"
# The keyboard can cover the checkbox and the submit button.
- hideKeyboard
# Dates start unset and "no dates" is off: an undated trip needs the checkbox first.
- tapOn: "${FORM_NO_DATES}"
- assertVisible: "${FORM_NO_DATES_HINT}"
- tapOn: "${FORM_CREATE}"

# --- S7 (AC-9, AC-10) -> flight form (S9) -> cancel -> back ------------------------------------
# The sheet is replaced by the details once the server has created the trip. S7 is recognised by
# its "add flight" button (any trip's details screen has it), not by the place (the form's input
# still holds it until the sheet is gone).
- extendedWaitUntil:
    visible: "${ADD_FLIGHT}"
    timeout: 30000
- assertVisible: "${E2E_PLACE}"
# AC-9: S7 has no tab bar, so none of the three tab labels is on screen.
- assertNotVisible: "${TAB_TRIPS}"
- assertNotVisible: "${TAB_HISTORY}"
- assertNotVisible: "${TAB_PROFILE}"
- tapOn: "${ADD_FLIGHT}"
- assertVisible: "${FLIGHT_FORM_FROM}"
- tapOn: "${CANCEL}"
# AC-12: cancel closes the modal and we are on S7 again.
- assertVisible: "${ADD_FLIGHT}"
- tapOn: "${BACK}"
# AC-10: back lands on Trips, with its tab still the active one, and the new trip's card is there.
- assertVisible:
    text: "${TAB_TRIPS}"
    selected: true
- extendedWaitUntil:
    visible: "${E2E_PLACE},.*"
    timeout: 15000

# --- Trips card -> S7 -> back --------------------------------------------------------------------
- tapOn: "${E2E_PLACE},.*"
- extendedWaitUntil:
    visible: "${ADD_FLIGHT}"
    timeout: 15000
- tapOn: "${BACK}"
- assertVisible:
    text: "${TAB_TRIPS}"
    selected: true

# --- Profile -> sign out -> onboarding (AC-13, AC-22) -------------------------------------------------
- tapOn: "${TAB_PROFILE}"
- assertVisible: "${LOGOUT}"
- tapOn: "${LOGOUT}"
- assertVisible: "${ONBOARDING_TITLE}"
