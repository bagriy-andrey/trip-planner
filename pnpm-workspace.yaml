# supabase/ is a Supabase CLI project (SQL + Deno edge functions), not a pnpm package.
# Add `web` here when the website is started.
packages:
  - mobile
  - shared
  - e2e
# pnpm 11 blocks dependency build scripts by default. Neither is needed here:
# unrs-resolver ships prebuilt binaries via optionalDependencies; @parcel/watcher is optional.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
# Expo SDK 57 packages were published <24h before scaffolding and tripped pnpm's default
# minimumReleaseAge (1 day). Safe to delete once these versions are older than that.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo-router@57.0.22
  - expo@57.0.24
